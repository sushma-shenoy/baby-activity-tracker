<ion-header translucent="true" class="app-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home">
      </ion-back-button>
    </ion-buttons>
    <ion-title>Baby Dashboard</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="dashboard-page">
  <main class="dashboard-content">

    <!-- HERO -->
    <section class="dashboard-hero">
      <div class="hero-copy">
        <p class="eyebrow">
          Daily overview
        </p>

        <h1>{{ greeting }}</h1>

        <p>
          Last feed:
          <strong>{{ stats.lastFeedAgo }}</strong>
        </p>
      </div>

      <div class="hero-icon">
        👶
      </div>
    </section>

    <!-- ACTIVE SLEEP -->
    <button type="button" class="active-sleep-card" *ngIf="hasActiveSleepSession" (click)="goTo('sleep')">

      <div class="active-sleep-icon">
        😴
      </div>

      <div class="active-sleep-content">
        <p>
          {{
          isSleepRunning
          ? 'Sleep timer running'
          : 'Sleep timer paused'
          }}
        </p>

        <h2>{{ sleepTimerDisplay }}</h2>
      </div>

      <ion-icon name="chevron-forward-outline">
      </ion-icon>
    </button>

    <!-- LATEST GROWTH -->
    <button
      type="button"
      class="growth-snapshot"
      (click)="goTo('growth')">
      <span class="growth-snapshot-icon">⚖️</span>

      <span class="growth-snapshot-copy">
        <small>Latest weight</small>
        <strong>
          {{
            latestWeight
              ? (latestWeight.weightKg | number: '1.1-2') + ' kg'
              : 'Add daily weight'
          }}
        </strong>
        <span>{{ latestWeightDate }}</span>
      </span>

      <ion-icon name="chevron-forward-outline">
      </ion-icon>
    </button>

    <button
      type="button"
      class="vaccination-snapshot"
      (click)="goTo('vaccination')">
      <span class="vaccination-snapshot-icon">🩹</span>

      <span class="vaccination-snapshot-copy">
        <small>Next vaccination date</small>
        <strong>
          {{
            nextVaccination
              ? nextVaccination.vaccineName
              : 'Add vaccination record'
          }}
        </strong>
        <span>{{ nextVaccinationDate }}</span>
      </span>

      <ion-icon name="chevron-forward-outline">
      </ion-icon>
    </button>

    <section class="care-snapshot-grid">
      <button
        type="button"
        class="care-snapshot temperature-snapshot"
        (click)="goTo('temperature')">
        <span class="care-snapshot-icon">🌡️</span>
        <span>
          <small>Latest temperature</small>
          <strong>
            {{ latestTemperatureDisplay }}
          </strong>
          <span>{{ latestTemperatureDetail }}</span>
        </span>
      </button>

      <button
        type="button"
        class="care-snapshot milestone-snapshot"
        (click)="goTo('milestones')">
        <span class="care-snapshot-icon">🌟</span>
        <span>
          <small>Latest milestone</small>
          <strong>
            {{ latestMilestone?.title || 'Add a milestone' }}
          </strong>
          <span>{{ latestMilestoneDate }}</span>
        </span>
      </button>
    </section>

    <button
      type="button"
      class="active-nursing-card"
      *ngIf="activeNursing"
      (click)="goTo('feeding')">
      <span>🤱</span>
      <span>
        <small>
          {{
            activeNursing.activeSide
              ? ('Nursing on ' + activeNursing.activeSide)
              : 'Nursing paused'
          }}
        </small>
        <strong>{{ nursingTimerDisplay }}</strong>
      </span>
      <ion-icon name="chevron-forward-outline"></ion-icon>
    </button>

    <!-- QUICK ACTIONS -->
    <section class="quick-actions-section">
      <div class="section-heading">
        <div>
          <p class="section-eyebrow">
            Quick log
          </p>

          <h2>Add activity</h2>
        </div>
      </div>

      <div class="quick-actions">

        <button type="button" class="quick-action feed-action" (click)="add('feeding')">

          <span class="quick-action-icon">
            🍼
          </span>

          <span class="quick-action-label">
            Feeding
          </span>
        </button>

        <button type="button" class="quick-action solids-action" (click)="add('solids')">

          <span class="quick-action-icon">
            🥣
          </span>

          <span class="quick-action-label">
            Solids
          </span>
        </button>

        <button type="button" class="quick-action sleep-action" (click)="add('sleep')">

          <span class="quick-action-icon">
            😴
          </span>

          <span class="quick-action-label">
            Sleep
          </span>
        </button>

        <button type="button" class="quick-action diaper-action" (click)="add('diaper')">

          <span class="quick-action-icon">
            🧷
          </span>

          <span class="quick-action-label">
            Diaper
          </span>
        </button>
      </div>
    </section>

    <!-- TODAY STATS -->
    <section class="stats-section">
      <div class="section-heading">
        <div>
          <p class="section-eyebrow">
            Today
          </p>

          <h2>Daily summary</h2>
        </div>

        <span class="today-label">
          {{ todayLabel }}
        </span>
      </div>

      <div class="stats-grid">

        <button type="button" class="stat-card feed-stat" (click)="goTo('feeding')">

          <div class="stat-icon">
            🍼
          </div>

          <strong>
            {{ stats.feeding }}
          </strong>

          <span>
            {{
            stats.feeding === 1
            ? 'Feed'
            : 'Feeds'
            }}
          </span>
        </button>

        <button type="button" class="stat-card solids-stat" (click)="goTo('solids')">

          <div class="stat-icon">
            🥣
          </div>

          <strong>
            {{ stats.solids }}
          </strong>

          <span>
            Solid meals
          </span>
        </button>

        <button type="button" class="stat-card sleep-stat" (click)="goTo('sleep')">

          <div class="stat-icon">
            😴
          </div>

          <strong>
            {{ stats.sleep }}
          </strong>

          <span>
            Sleep
          </span>
        </button>

        <button type="button" class="stat-card diaper-stat" (click)="goTo('diaper')">

          <div class="stat-icon">
            🧷
          </div>

          <strong>
            {{ stats.diaper }}
          </strong>

          <span>
            {{
            stats.diaper === 1
            ? 'Change'
            : 'Changes'
            }}
          </span>
        </button>
      </div>
    </section>

    <!-- TIMELINE -->
    <section class="timeline-section">
      <div class="section-heading timeline-heading">
        <div>
          <p class="section-eyebrow">
            Latest updates
          </p>

          <h2>Recent activity</h2>
        </div>

        <span class="activity-count">
          {{ todayActivityCount }}
        </span>
      </div>

      <div class="empty-timeline" *ngIf="activities.length === 0">

        <div class="empty-icon">
          📝
        </div>

        <h3>No activity recorded</h3>

        <p>
          Feeding, solids, sleep and diaper entries will appear here.
        </p>
      </div>

      <div class="timeline-list" *ngIf="activities.length > 0">

        <button type="button" class="timeline-item" *ngFor="
            let activity of activities;
            trackBy: trackByActivityId
          " (click)="goTo(activity.type)">

          <div class="timeline-icon" [class.feed-icon]="
              activity.type === 'feeding'
            " [class.sleep-icon]="
              activity.type === 'sleep'
            " [class.solids-icon]="
              activity.type === 'solids'
            " [class.diaper-icon]="
              activity.type === 'diaper'
            ">

            {{ getIcon(activity.type) }}
          </div>

          <div class="timeline-copy">
            <div class="timeline-title-row">
              <h3>{{ activity.title }}</h3>

              <time>
                {{ activity.time }}
              </time>
            </div>

            <p>{{ activity.value }}</p>
          </div>

          <ion-icon class="timeline-arrow" name="chevron-forward-outline">
          </ion-icon>
        </button>
      </div>
    </section>
  </main>
</ion-content>
